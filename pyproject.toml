[project]
name = "refund-approval-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FaizanSiddiuqe", email = "154720299+FaizanSiddiuqe@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
refund-approval-system = "refund_approval_system:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
